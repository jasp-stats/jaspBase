on: [push, pull_request]
name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.os }}

    name: ${{ matrix.os }} (${{ matrix.r }})

    strategy:
      fail-fast: false
      matrix:
        r: [oldrel, release, devel]
        os: [ubuntu-latest, macOS-latest, windows-latest]

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:

      - uses: actions/checkout@v2

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true

      # On macOS R-devel there are no binary packages, so everything is built from source.
      # CRAN's R-devel has NLS enabled, so e.g. data.table needs libintl.h, which CRAN's
      # build machines get from the gettext recipe in /opt/R/<arch>; the runner does not have it.
      - name: Install gettext (macOS R-devel)
        if: runner.os == 'macOS' && matrix.r == 'devel'
        run: sudo Rscript -e 'source("https://mac.R-project.org/bin/install.R"); install.libs("gettext")'

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: rcmdcheck

      - uses: r-lib/actions/check-r-package@v2
        with:
          error-on: '"error"'
          needs: check

      - name: Show testthat output
        if: always()
        run: find check -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

