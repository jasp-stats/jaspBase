on: [push, pull_request]
name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.os }}

    name: ${{ matrix.os }} (${{ matrix.r }})

    strategy:
      fail-fast: false
      matrix:
        r: [oldrel, release, devel]
        os: [ubuntu-latest, macOS-latest, windows-latest]

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:

      - uses: actions/checkout@v2

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true

      # On macOS R-devel there are no binary packages, so everything is built from source.
      # CRAN's build machines get the system libraries for that from its recipes in
      # /opt/R/<arch>; the runner does not have them. Install the ones our dependencies need:
      #   gettext (libintl.h, R-devel has NLS enabled): data.table
      #   libpng: svglite, rvg; freetype: gdtools; freetype/libpng/tiff/jpeg/libwebp: ragg
      #   fontconfig/freetype/harfbuzz/fribidi: systemfonts, textshaping
      # ragg & co. locate them via `pkg-config --static`, so put CRAN's pkg-config
      # (which searches /opt/R/<arch>/lib/pkgconfig) first on the PATH.
      - name: Install system libraries (macOS R-devel)
        if: runner.os == 'macOS' && matrix.r == 'devel'
        run: |
          sudo Rscript -e 'source("https://mac.R-project.org/bin/install.R"); install.libs(c("gettext", "pkgconfig", "libpng", "freetype", "fontconfig", "harfbuzz", "fribidi", "jpeg", "tiff", "libwebp"))'
          echo "/opt/R/$(uname -m)/bin" >> "$GITHUB_PATH"

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: rcmdcheck

      - uses: r-lib/actions/check-r-package@v2
        with:
          error-on: '"error"'
          needs: check

      - name: Show testthat output
        if: always()
        run: find check -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      # Do we want this?
